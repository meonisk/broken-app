# Замеры «до» и «после» одним прогоном на одной машине: только так criterion
# рисует сравнение с базовой линией, а разница во времени не объясняется тем,
# что стадиям достались разные раннеры.
name: bench

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Коммит с кодом до оптимизации"
        required: true
        default: 8c42bd8

env:
  CARGO_TERM_COLOR: never

jobs:
  bench:
    name: criterion + critcmp + callgrind + dhat + flamegraph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # nightly нужен только для профилируемого бинарника: -Z build-std
      # пересобирает стандартную библиотеку с frame pointers, без этого perf
      # срывается в hashbrown и String и выдаёт башни [unknown]. Ставится первым,
      # чтобы умолчанием остался stable — им считаются все замеры.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: dtolnay/rust-toolchain@stable

      - name: Установить инструменты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind librsvg2-bin \
            linux-tools-common linux-tools-generic
          cargo install critcmp inferno --locked
          sudo sysctl -w kernel.perf_event_paranoid=1
          mkdir -p logs/fixed logs/after

      # Бенчмарки и входы всё время одни и те же, меняется только src/.
      - name: Код до оптимизации
        env:
          BASE: ${{ inputs.base }}
        run: |
          git checkout "$BASE" -- src/
          git --no-pager diff --stat HEAD -- src/

      # REPEAT подобран так, чтобы в профиле набралось несколько тысяч выборок.
      # На пропорции внутри картинки он не влияет: каждый повтор прогоняет все
      # бенчмарки по одному разу.
      - name: Замеры до оптимизации
        env:
          REPEAT: 10
        run: |
          cargo bench --bench criterion -- --save-baseline fixed 2>&1 | tee logs/fixed/criterion.txt
          cargo bench --no-run --message-format=json > /tmp/bench.json 2>/dev/null || true
          export BENCH=$(jq -r 'select(.executable != null and .target.name == "criterion") | .executable' \
            /tmp/bench.json | sort -u | head -1)
          export BENCH_FP=$(RUSTFLAGS="-C force-frame-pointers=yes" CARGO_TARGET_DIR=/tmp/target-fp \
            cargo +nightly bench --no-run -Z build-std \
              --target x86_64-unknown-linux-gnu --message-format=json 2>/dev/null \
            | jq -r 'select(.executable != null and .target.name == "criterion") | .executable' \
            | sort -u | head -1)
          # Ядро обрезает имя процесса до 15 символов; по нему из свёрнутых
          # стеков выбрасывается всё, что не целевой бинарник, — иначе в профиль
          # попадают bash и seq из цикла ниже.
          COMM=$(basename "$BENCH_FP" | cut -c1-15)
          perf record -F 997 -g -o /tmp/perf.data -- \
            bash -c 'for i in $(seq "$REPEAT"); do "$BENCH_FP" --bench --test > /dev/null; done'
          perf script -i /tmp/perf.data | inferno-collapse-perf > /tmp/folded-all.txt
          grep "^$COMM" /tmp/folded-all.txt > /tmp/folded.txt \
            || cp /tmp/folded-all.txt /tmp/folded.txt
          inferno-flamegraph --title "broken-app до оптимизации" \
            --subtitle "criterion --bench --test x$REPEAT, коммит ${{ inputs.base }}" \
            /tmp/folded.txt > logs/fixed/flamegraph.svg
          rsvg-convert --width 1600 -o logs/fixed/flamegraph.png logs/fixed/flamegraph.svg
          # Отдельно fib: в общем профиле он около процента, на такой ширине
          # рекурсию не разглядеть.
          perf record -F 997 -g -o /tmp/perf-fib.data -- \
            bash -c 'for i in $(seq 300); do "$BENCH_FP" --bench --test fib > /dev/null; done'
          perf script -i /tmp/perf-fib.data | inferno-collapse-perf > /tmp/folded-fib-all.txt
          grep "^$COMM" /tmp/folded-fib-all.txt > /tmp/folded-fib.txt \
            || cp /tmp/folded-fib-all.txt /tmp/folded-fib.txt
          inferno-flamegraph --title "broken-app: только бенчмарк fib_32, до оптимизации" \
            --subtitle "criterion --bench --test fib x300, коммит ${{ inputs.base }}" \
            /tmp/folded-fib.txt > logs/fixed/flamegraph-fib.svg
          rsvg-convert --width 1600 -o logs/fixed/flamegraph-fib.png logs/fixed/flamegraph-fib.svg
          valgrind --tool=callgrind --callgrind-out-file=logs/fixed/callgrind.out \
            "$BENCH" --bench --test > /dev/null 2>&1
          callgrind_annotate logs/fixed/callgrind.out > logs/fixed/callgrind.txt
          valgrind --tool=dhat --dhat-out-file=logs/fixed/dhat.json \
            "$BENCH" --bench --test > logs/fixed/dhat.txt 2>&1

      - name: Вернуть оптимизированный код
        run: |
          git checkout HEAD -- src/
          git --no-pager diff --stat HEAD -- src/

      # Здесь повторов больше: после оптимизации один прогон всех бенчмарков
      # занимает пару миллисекунд, и при REPEAT=10 выборок было бы полсотни.
      - name: Замеры после оптимизации
        env:
          REPEAT: 300
        run: |
          cargo bench --bench criterion -- --baseline fixed 2>&1 | tee logs/after/criterion.txt
          cargo bench --no-run --message-format=json > /tmp/bench.json 2>/dev/null || true
          export BENCH=$(jq -r 'select(.executable != null and .target.name == "criterion") | .executable' \
            /tmp/bench.json | sort -u | head -1)
          export BENCH_FP=$(RUSTFLAGS="-C force-frame-pointers=yes" CARGO_TARGET_DIR=/tmp/target-fp \
            cargo +nightly bench --no-run -Z build-std \
              --target x86_64-unknown-linux-gnu --message-format=json 2>/dev/null \
            | jq -r 'select(.executable != null and .target.name == "criterion") | .executable' \
            | sort -u | head -1)
          # Ядро обрезает имя процесса до 15 символов; по нему из свёрнутых
          # стеков выбрасывается всё, что не целевой бинарник, — иначе в профиль
          # попадают bash и seq из цикла ниже.
          COMM=$(basename "$BENCH_FP" | cut -c1-15)
          perf record -F 997 -g -o /tmp/perf.data -- \
            bash -c 'for i in $(seq "$REPEAT"); do "$BENCH_FP" --bench --test > /dev/null; done'
          perf script -i /tmp/perf.data | inferno-collapse-perf > /tmp/folded-all.txt
          grep "^$COMM" /tmp/folded-all.txt > /tmp/folded.txt \
            || cp /tmp/folded-all.txt /tmp/folded.txt
          inferno-flamegraph --title "broken-app после оптимизации" \
            --subtitle "criterion --bench --test x$REPEAT, коммит $(git rev-parse --short HEAD)" \
            /tmp/folded.txt > logs/after/flamegraph.svg
          rsvg-convert --width 1600 -o logs/after/flamegraph.png logs/after/flamegraph.svg
          valgrind --tool=callgrind --callgrind-out-file=logs/after/callgrind.out \
            "$BENCH" --bench --test > /dev/null 2>&1
          callgrind_annotate logs/after/callgrind.out > logs/after/callgrind.txt
          valgrind --tool=dhat --dhat-out-file=logs/after/dhat.json \
            "$BENCH" --bench --test > logs/after/dhat.txt 2>&1

      - name: Сравнение
        run: |
          critcmp --export fixed > logs/baseline-fixed.json
          critcmp --export new > logs/baseline-after.json
          critcmp fixed new | tee logs/critcmp.txt
          cp -r target/criterion logs/criterion-report

      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: logs/
          overwrite: true
