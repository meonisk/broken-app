# Формат, линты и тесты на каждый push. Windows добавлен потому, что работа
# велась на нём, а проверять будут скорее всего на Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить стабильный Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Кеш зависимостей и артефактов сборки
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Форматирование
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Тесты
        run: cargo test

  windows:
    name: сборка и тесты (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить стабильный Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Сборка
        run: cargo build

      - name: Тесты
        run: cargo test
